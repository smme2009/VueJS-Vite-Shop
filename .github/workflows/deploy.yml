name: '自動部署至GCE'

# 觸發條件
on:
  push:
    branches:
      - 'feature/2.0'

# 執行工作
jobs:
  # 打包和部署
  build-and-deploy:
    # 工作名稱
    name: '打包並部署'

    # 作業系統
    runs-on: 'ubuntu-latest'

    # 步驟
    steps:
      # 下載原始碼
      - name: '下載原始碼'
        uses: 'actions/checkout@v4'

      # 加入Node.js環境
      - name: '加入Node.js'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '24'
          cache: 'npm'

      # 打包專案
      - name: '打包專案'
        env:
          VITE_APP_API_URL: ${{ secrets.VITE_APP_API_URL }}
        run: |
          npm install
          npm run build

      # 壓縮專案
      - name: '壓縮專案'
        run: |
          tar -czf project.tar.gz -C dist .

      # 驗證GCP權限
      - name: '驗證GCP權限'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_KEY }}'

      # 加入Gcloud CLI
      - name: '加入Gcloud CLI'
        uses: 'google-github-actions/setup-gcloud@v2'

      # 將檔案傳送到GCE
      - name: '將檔案傳送到GCE'
        run: |
          gcloud compute scp project.tar.gz \
            ${{ secrets.GCE_NAME }}:/tmp/${{ secrets.APP_URL }}.tar.gz \
            --zone=${{ secrets.GCE_ZONE }}

      # 部署GCE中的專案
      - name: '部署GCE中的專案'
        run: |
          gcloud compute ssh ${{ secrets.GCE_NAME }} --zone=${{ secrets.GCE_ZONE }} --command="
            # 建立臨時目錄
            sudo mkdir -p /tmp/${{ secrets.APP_URL }}

            # 解壓縮到臨時目錄
            sudo tar -xzf /tmp/${{ secrets.APP_URL }}.tar.gz -C /tmp/${{ secrets.APP_URL }}

            # 搬移新專案
            sudo rsync -a --delete /tmp/${{ secrets.APP_URL }}/ /var/www/${{ secrets.APP_URL }}/

            # 清理暫存檔案
            sudo rm /tmp/${{ secrets.APP_URL }}.tar.gz
            sudo rm -rf /tmp/${{ secrets.APP_URL }}
          "
